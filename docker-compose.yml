services:
  # Local Vector Database
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: private_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Local LLM Inference Engine: Ollama (Excellent for local dev & quick prototyping)
  ollama:
    image: ollama/ollama:latest
    container_name: private_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # High-Throughput Production LLM Inference Engine: vLLM (OpenAI-compatible)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: private_vllm
    ports:
      - "8000:8000"
    environment:
      - MODEL=Qwen/Qwen2.5-Coder-7B-Instruct
      - MAX_MODEL_LEN=4096
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    command: --model Qwen/Qwen2.5-Coder-7B-Instruct --port 8000 --max-model-len 4096 --trust-remote-code

  # Local Tracing & Observability: Arize Phoenix (Self-Hosted, Air-Gapped)
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: private_phoenix
    ports:
      - "6006:6006"
    restart: unless-stopped

  # Backend Private Agent API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: private_agent_backend
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - LLM_PROVIDER=vllm # Switch dynamically to 'ollama' or 'vllm'
      - vLLM_URL=http://vllm:8000/v1
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006
    depends_on:
      - qdrant
      - phoenix
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  vllm_cache:
